# Paths are relative to this configuration file. Products must already exist.
# Station name and antenna reference-point ECEF position come from setup.json
# (marker XYZ plus marker-to-ARP NEU offset). Optional explicit overrides:
# station = "BX4ACP"
# position_ecef_m = [-2972418.7226, 5005726.1893, 2597096.1561]
products_root = "../work/products"
# Load Setup antenna.calibration_file; explicit "none" permits uncorrected research.
receiver_antenna = "required"
# Enable nearest-constant extrapolation when native L5 calibration is absent.
allow_extrapolated_antenna = false
antenna_extrapolation_max_mhz = 60.0
# L1-anchored pair families and exact-code priorities are automatic.
# Use one local satellite code-bias family; OSB BIA or DSB BSX, GPST.
bias_product_family = "COD0MGXFIN"
interval = 30.0
gap_timeout = 50.0
elevation_deg = 10.0
level_elevation_deg = 30.0
min_arc_seconds = 600.0
min_level_samples = 20
# Conservative GF jump candidates split arcs; these are not proven cycle slips.
gf_jump_m = 0.25
gf_rate_m_s = 0.05
# MSLM mapping height, NOT the CODE IONEX 450 km IPP shell height.
mapping_height_km = 506.7
margin_hours = 6.0

[dcb]
# Windows start at the first emitted sample, not at storage-day boundaries.
window_hours = 24.0
bin_seconds = 300.0
min_hours = 6.0
min_satellites = 4
min_arcs = 6
elevation_deg = 30.0
gim_rms_floor_tecu = 2.0
max_scatter_tecu = 15.0
