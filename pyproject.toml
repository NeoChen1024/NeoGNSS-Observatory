[project]
name = "neognss-observatory"
version = "0.0.0a0"
description = "Reproducible offline GNSS observation and processing tools"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Neo_Chen", email = "chenkolei@gmail.com" }]
dynamic = ["dependencies"]

[project.scripts]
ngo-stec = "neognss_observatory.stec:cli"
ngo-ppp = "neognss_observatory.ppp:cli"
ngo-ppp-plot = "neognss_observatory.ppp_plot:cli"
ngo-receiver-clock = "neognss_observatory.receiver_clock:cli"
ngo-receiver-clock-plot = "neognss_observatory.receiver_clock_plot:cli"
ngo-receiver-clock-reunwrap = "neognss_observatory.receiver_clock_reunwrap:cli"
ngo-cddis-download = "neognss_observatory.cddis_download:cli"
ngo-dataset-qa = "neognss_observatory.dataset_qa:cli"
ngo-sbas-frame-parquet = "neognss_observatory.sbas_extract:cli"
ngo-sbas-grid-parquet = "neognss_observatory.sbas_grid_parquet:cli"
ngo-sbas-grid-plot = "neognss_observatory.sbas_grid_plot:cli"
ngo-sbas-map-video = "neognss_observatory.sbas_map_video:cli"
ngo-sbf-rinex = "neognss_observatory.sbf_rinex:cli"
ngo-rinex-observation-audit = "neognss_observatory.sbf_rinex:audit_cli"

[build-system]
requires = ["setuptools>=77.0.3", "pybind11>=3.1.0", "click>=8.5.0", "pynmeagps>=1.1.7", "pyrtcm>=1.2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["python-src"]

[tool.black]
line-length = 132
target-version = ['py311']
extend-exclude = '/contrib/'

[tool.isort]
profile = "black"
extend_skip = ["contrib"]
known_first_party = ["neognss_observatory"]
